name: Build Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Build siso-ng
        run: ./buildrelease.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: siso-ng-linux
          path: siso-ng
          if-no-files-found: error
