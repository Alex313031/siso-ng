name: Build Siso-ng for Linux

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (go-legacy-win7)
        env:
          GO_LEGACY_VERSION: '1.26.4-1'
        run: |
          GO_TARBALL="go-legacy-win7-${GO_LEGACY_VERSION}.linux_amd64.tar.gz"
          GO_URL="https://github.com/thongtech/go-legacy-win7/releases/download/v${GO_LEGACY_VERSION}/${GO_TARBALL}"
          curl -fsSL -o "${GO_TARBALL}" "${GO_URL}"
          sudo tar -C /usr/local -xzf "${GO_TARBALL}"
          rm -f "${GO_TARBALL}"
          echo "GOROOT=/usr/local/go-legacy-win7" >> "$GITHUB_ENV"
          echo "GOPATH=$HOME/go" >> "$GITHUB_ENV"
          echo "/usr/local/go-legacy-win7/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          /usr/local/go-legacy-win7/bin/go version

      - name: Build siso-ng
        run: ./build.sh --linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: siso-ng_linux
          path: release/siso-ng_linux_*.zip
          if-no-files-found: error
