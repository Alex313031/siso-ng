name: Build Siso-ng Linux

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Build siso-ng
        run: ./buildrelease.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: siso-ng_linux
          path: siso-ng
          if-no-files-found: error
