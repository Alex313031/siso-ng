name: Build Siso-ng for Linux

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Build siso-ng
        run: ./build.sh --linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: siso-ng_linux
          path: release/siso-ng_linux_*.zip
          if-no-files-found: error
