name: Build Siso-ng for MacOS

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build macOS x64 & arm64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Cross-compile siso-ng for macOS
        run: ./build.sh --mac

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: siso-ng_macos
          path: release/siso-ng_macos_*.zip
          if-no-files-found: error
