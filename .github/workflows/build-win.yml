name: Build Siso-ng Windows

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Win64
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Cross-compile siso-ng.exe
        run: |
          ./buildrelease.sh
          mv siso-ng siso-ng.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: siso-ng_win
          path: siso-ng.exe
          if-no-files-found: error
