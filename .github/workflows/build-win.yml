name: Build Siso-ng for Windows

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build Win32 & Win64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Cross-compile siso-ng.exe
        run: ./build.sh -w

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: siso-ng_win
          path: release/siso-ng_win_*.zip
          if-no-files-found: error
