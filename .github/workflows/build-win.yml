name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Cross-compile siso-ng.exe
        run: |
          ./buildrelease.sh
          mv siso-ng siso-ng.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: siso-ng-windows
          path: siso-ng.exe
          if-no-files-found: error
