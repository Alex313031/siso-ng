name: Build Siso-ng for Windows

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build Win32 & Win64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (go-legacy-win7)
        env:
          GO_LEGACY_VERSION: '1.27.3-1'
        run: |
          GO_TARBALL="go-legacy-win7-${GO_LEGACY_VERSION}.linux_amd64.tar.gz"
          GO_URL="https://github.com/thongtech/go-legacy-win7/releases/download/v${GO_LEGACY_VERSION}/${GO_TARBALL}"
          curl -fsSL -o "${GO_TARBALL}" "${GO_URL}"
          sudo tar -C /usr/local -xzf "${GO_TARBALL}"
          rm -f "${GO_TARBALL}"
          echo "GOROOT=/usr/local/go-legacy-win7" >> "$GITHUB_ENV"
          echo "GOPATH=$HOME/go" >> "$GITHUB_ENV"
          # Pin to the toolchain we just installed. Without this, a go directive
          # in go.mod newer than GO_LEGACY_VERSION makes Go silently download the
          # official toolchain, which would build a binary without win7 support.
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          echo "/usr/local/go-legacy-win7/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          /usr/local/go-legacy-win7/bin/go version

      - name: Cross-compile siso-ng.exe
        run: ./build.sh -w

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: siso-ng_win
          path: release/siso-ng_win_*.zip
          if-no-files-found: error
